<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Food Mess Management</title>
    <link rel="stylesheet" href="css/style.css?v=20261101.1">
</head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo" aria-hidden="true">SM</div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the Smart Food Mess</p>
        </div>
        <div class="error-message" id="errorMessage" role="alert" hidden></div>
        <form id="registerForm" action="register" method="post" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-wrap">
                    <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name">
                </div>
                <small class="field-error" id="nameError"></small>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                </div>
                <small class="field-error" id="emailError"></small>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <small class="field-error" id="passwordError"></small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrap">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
                </div>
                <small class="field-error" id="confirmError"></small>
            </div>
            <button type="submit" class="btn-login">Create Account</button>
        </form>
        <p class="register-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>
<script src="js/auth-messages.js"></script>
<script src="js/register.js"></script>
</body>
</html>
